# A médiaszerver helyi futtatása és docker-tesztje (kiemelési terv WP49; terv 4.4, 7.2). Csak fejlesztésre: a
# szerveres telepítés a ../deploy/compose.yaml (ugyanez a keményítés, a kész image címkéjével).
# Az image a Dockerfile-ból épül (a konfig és az njs benne van); csak az apps.json és a médiagyökér csatolt.
#
#   docker compose up -d --build --wait                                         # konfig- / njs-változás után is
#   docker compose exec media nginx -c /etc/nginx/media/nginx.conf -t          # konfigteszt
#   docker compose exec media nginx -c /etc/nginx/media/nginx.conf -s reload   # újratöltés (új apps.json-tartalom)

name: ${COMPOSE_PROJECT_NAME:-media-server}

services:
  media:
    build: .
    # A docker-teszt a MEDIA_IMAGE-dzsel egy kész (pl. kiadási) image-et indít, build nélkül.
    image: ${MEDIA_IMAGE:-media-server:dev}
    environment:
      NET_GATEWAY: ${NET_GATEWAY:-172.29.90.1}
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /run
      - /tmp
    ports:
      - "${BIND:-127.0.0.1}:${PORT:-10090}:80"
    volumes:
      - ${APPS_JSON:?APPS_JSON kell (.env)}:/etc/nginx/secrets/apps.json:ro
      - ${MEDIA_ROOT:?MEDIA_ROOT kell (.env)}:/srv/media:ro
    networks:
      - media
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  media:
    # Rögzített alhálózat: a portkiadás a kapcsolatot az átjáróról adja, a real_ip csak azt bízza meg (P4).
    ipam:
      config:
        - subnet: ${NET_SUBNET:-172.29.90.0/24}
          gateway: ${NET_GATEWAY:-172.29.90.1}
