# A médiaszerver nginx-konfigja (terv 4.4, 7.3; implementációs terv WP2).
# A konténerben: /etc/nginx/media/nginx.conf (a compose `-c`-vel indítja; a `nginx -t` / `-s reload` is `-c`-vel).
# A token-ellenőrzés az njs-ben (../njs/media.js), a kulcsok az apps.json-ban (js_preload_object).

load_module modules/ngx_http_js_module.so;

user  nginx;
worker_processes  auto;
pid   /run/nginx.pid;

# A naplóba nem kerülhet token: az error_log csak warn-tól (a limit_* elutasításai info szinten, lásd media.conf).
error_log  /dev/stderr warn;

events {
    worker_connections  1024;
}

http {
    # Saját típustábla (terv 4.4; a backend MEDIA_CONTENT_TYPES-a + a tartalomkiadás). Minden más 404 az njs-ben.
    types {
        video/mp4         mp4;
        audio/mp4         m4a;
        image/jpeg        jpg;
        application/gzip  gz;
    }
    default_type  application/octet-stream;
    charset       off;

    server_tokens  off;
    sendfile       on;
    tcp_nopush     on;
    keepalive_timeout  65;
    gzip           off;

    # Írható ideiglenes könyvtárak a csak olvasható konténerben (tmpfs).
    client_body_temp_path  /tmp/client_body;
    proxy_temp_path        /tmp/proxy;
    fastcgi_temp_path      /tmp/fastcgi;
    uwsgi_temp_path        /tmp/uwsgi;
    scgi_temp_path         /tmp/scgi;

    # Valódi kliens-IP: csak a compose-hálózat átjárójától (a host-nginx portkiadása), terv 4.4 / impl. terv P4.
    # A set_real_ip_from sort az image envsubst-je írja a templates/realip.conf.template-ből (NET_GATEWAY).
    include  /etc/nginx/conf.d/realip.conf;
    real_ip_header     X-Forwarded-For;
    real_ip_recursive  off;

    js_path            /etc/nginx/njs;
    js_import          media from media.js;
    js_preload_object  apps from /etc/nginx/secrets/apps.json;

    include  /etc/nginx/media/media.conf;
}
