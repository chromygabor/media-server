# A médiaszerver server-blokkja (terv 4.4; implementációs terv WP2).
# Sorrend: a fő location a rewrite-fázisban dönt a js_set változókból ($media_status: ok / 403 / 404 / 410;
# az `if` csak `return`-nel), utána a try_files a /srv/media/<dir>/<assetKey> fájlt adja az nginx statikus
# motorjával (sendfile, Range / 206 / 416, ETag, Last-Modified, HEAD). A token soha nem kerül a naplóba.

js_set  $media_status       media.status;
js_set  $media_reason       media.reason;
js_set  $media_file         media.file;
js_set  $media_app          media.app;
js_set  $media_kid          media.kid;
js_set  $media_u            media.user;
js_set  $media_user_key     media.userKey;
js_set  $media_path         media.path;
js_set  $media_cache        media.cache;
js_set  $media_corp         media.corp;
js_set  $media_cors_origin  media.corsOrigin;

# CORS csak az app saját origins listájából (üres érték → a fejléc nem kerül ki).
map $media_cors_origin $media_cors_expose {
    ""       "";
    default  "Content-Length, Content-Range, Accept-Ranges";
}
map $media_cors_origin $media_cors_methods {
    ""       "";
    default  "GET, HEAD, OPTIONS";
}
map $media_cors_origin $media_cors_headers {
    ""       "";
    default  "Range, If-Range";
}
map $media_cors_origin $media_cors_max_age {
    ""       "";
    default  "600";
}

# Cache-Control csak sikeres válaszon a njs szerint (böngészős: private, max-age=3600; _content/: no-store).
map "$status|$media_cache" $media_cache_control {
    "~^(200|206|304)\|(?<cc>.+)$"  $cc;
    default                        "no-store";
}

# JSON access log a stdoutra (terv 4.4): szétszedett mezők, a nyers URI és a query NÉLKÜL (abban token van).
log_format media_json escape=json
    '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
    '"app":"$media_app","kid":"$media_kid","u":"$media_u","path":"$media_path",'
    '"status":$status,"reason":"$media_reason","bytes":$bytes_sent,"rt":$request_time,'
    '"range":"$http_range","ua":"$http_user_agent"}';

# Korlátok (terv 4.4, kiinduló értékek). A $media_user_key `u` nélkül üres → arra nem korlátoz.
limit_conn_zone  $media_user_key      zone=media_user:10m;
limit_conn_zone  $media_app           zone=media_app:1m;
limit_req_zone   $binary_remote_addr  zone=media_denied:10m rate=10r/s;
limit_conn_status     503;
limit_req_status      429;
# Az elutasítások naplósora a kérés-URI-t (benne a tokent) is tartalmazná: info szinten, ami a warn alatt marad.
limit_conn_log_level  info;
limit_req_log_level   info;

server {
    listen       80 default_server;
    server_name  _;

    root           /srv/media;
    autoindex      off;
    log_not_found  off;
    access_log     /dev/stdout media_json;

    # A hibaválaszok (named location) közös fejlécei; minimális szöveges törzs, ok nélkül (az ok a naplóban).
    # A named location-ökben `types { }`, különben a Content-Type a kért fájl kiterjesztéséből jönne.
    add_header  X-Content-Type-Options  nosniff   always;
    add_header  Cache-Control           no-store  always;

    error_page  403  = @denied;
    error_page  404  = @notfound;
    error_page  410  = @gone;

    location = /healthz {
        access_log  off;
        return      204;
    }

    location / {
        # Preflight token-ellenőrzés nélkül; a CORS-fejlécek az app origins listájából.
        if ($request_method = OPTIONS) {
            return  204;
        }
        if ($request_method !~ ^(GET|HEAD)$) {
            return  405;
        }
        if ($media_status = 403) {
            return  403;
        }
        if ($media_status = 404) {
            return  404;
        }
        if ($media_status = 410) {
            return  410;
        }

        limit_conn        media_user  3;
        limit_conn        media_app   40;
        limit_rate_after  30m;
        limit_rate        600k;

        # A fájl létezése → különben 404 (könyvtárat nem ad: a $media_file nem végződik /-re).
        try_files  $media_file  =404;

        add_header  X-Content-Type-Options         nosniff                 always;
        add_header  Content-Disposition            inline                  always;
        add_header  Cross-Origin-Resource-Policy   $media_corp             always;
        add_header  Cache-Control                  $media_cache_control    always;
        add_header  Vary                           Origin                  always;
        add_header  Access-Control-Allow-Origin    $media_cors_origin      always;
        add_header  Access-Control-Expose-Headers  $media_cors_expose      always;
        add_header  Access-Control-Allow-Methods   $media_cors_methods     always;
        add_header  Access-Control-Allow-Headers   $media_cors_headers     always;
        add_header  Access-Control-Max-Age         $media_cors_max_age     always;
    }

    # Érvénytelen token: IP-nként ~10 r/s (a túllépés 429).
    # A `return` a rewrite-fázisban, a limit_req előtt futna, ezért a 403 az njs content-handleréből jön.
    location @denied {
        limit_req   zone=media_denied  burst=20  nodelay;
        js_content  media.denied;
    }

    location @notfound {
        types         { }
        default_type  text/plain;
        return        404  "not found\n";
    }

    location @gone {
        types         { }
        default_type  text/plain;
        return        410  "expired\n";
    }
}
