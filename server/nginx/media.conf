# A médiaszerver server-blokkja (terv 4.4; implementációs terv WP2; a kapu:
# aszimmetrikus terv 4., WP52, D112).
# Sorrend: a fő location `js_content`-je (media.gate) aszinkron ellenőriz (HS256 és ES256), a döntést a js_var-okba
# írja, és sikernél a @serve-be irányít (r.internalRedirect), ahol a limit_conn, a limit_rate, a try_files
# (/srv/media/<dir>/<assetKey>, az nginx statikus motorjával: sendfile, Range / 206 / 416, ETag, Last-Modified, HEAD)
# és a fejlécszűrő fut. Hibánál törzs nélküli r.return(403 / 404 / 410 / 429) → error_page → named location. A
# js_var az átirányítás után is megmarad (a dokumentáció szerint: „not overwritten after a redirect”). A token
# soha nem kerül a naplóba.

js_var  $media_status;
js_var  $media_reason;
js_var  $media_file;
js_var  $media_app;
js_var  $media_kid;
js_var  $media_u;
js_var  $media_user_key;
js_var  $media_kind;
# A token nélküli útvonal (napló): csak string-művelet, szinkron.
js_set  $media_path         media.path;

# JSON access log a stdoutra (terv 4.4): szétszedett mezők, a nyers URI és a query NÉLKÜL (abban token van).
log_format media_json escape=json
    '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
    '"app":"$media_app","kid":"$media_kid","u":"$media_u","path":"$media_path",'
    '"status":$status,"reason":"$media_reason","bytes":$bytes_sent,"rt":$request_time,'
    '"range":"$http_range","ua":"$http_user_agent"}';

# Korlátok (terv 4.4, kiinduló értékek). A $media_user_key `u` nélkül üres → arra nem korlátoz.
limit_conn_zone  $media_user_key      zone=media_user:10m;
limit_conn_zone  $media_app           zone=media_app:1m;
limit_req_zone   $binary_remote_addr  zone=media_denied:10m rate=10r/s;
limit_conn_status     503;
limit_req_status      429;
# Az elutasítások naplósora a kérés-URI-t (benne a tokent) is tartalmazná: info szinten, ami a warn alatt marad.
limit_conn_log_level  info;
limit_req_log_level   info;

server {
    listen       80 default_server;
    server_name  _;

    root           /srv/media;
    autoindex      off;
    log_not_found  off;
    access_log     /dev/stdout media_json;

    # A hibaválaszok (named location) minimális szöveges törzzsel, ok nélkül (az ok a naplóban); a közös fejlécük
    # (nosniff, no-store) location-önként, mert a server-szintű add_header a fő location-be is öröklődne.
    # A named location-ökben `types { }`, különben a Content-Type a kért fájl kiterjesztéséből jönne.

    error_page  403  = @denied;
    error_page  404  = @notfound;
    error_page  410  = @gone;
    # A kapu hibaszámlálójának 429-e (D116). A @denied limit_req-jének 429-e már egy error_page-en belül születik,
    # és az nginx a második átirányítást nem követi (recursive_error_pages off): az változatlan marad.
    error_page  429  = @toomany;

    location = /healthz {
        access_log  off;
        return      204;
    }

    location / {
        # Preflight token-ellenőrzés nélkül; a CORS-fejlécek az app origins listájából.
        if ($request_method = OPTIONS) {
            return  204;
        }
        # A 405 `Allow: GET, HEAD, OPTIONS` fejlécét a media.headers szűrő adja (D100), add_header nélkül.
        if ($request_method !~ ^(GET|HEAD)$) {
            return  405;
        }
        # Az OPTIONS 204 és a 405 fejlécei (CORS, CORP, Allow).
        js_header_filter  media.headers;
        # A kapu: ellenőrzés → js_var-ok → @serve, vagy 403 / 404 / 410 / 429 (error_page).
        js_content        media.gate;
    }

    # A sikeres kérés kiszolgálása (csak a kapu irányít ide). A korlátok kulcsa a kapu js_var-jaiból: a
    # $media_user_key `u` nélkül üres (→ nem korlátoz). A preaccess-fázis itt, a döntés után fut, ezért nem a fő
    # location-ben (ott a kulcs még üres volna; terv 1.3).
    location @serve {
        limit_conn        media_user  3;
        limit_conn        media_app   40;
        limit_rate_after  30m;
        limit_rate        600k;

        # A fájl létezése → különben 404 (könyvtárat nem ad: a $media_file nem végződik /-re).
        try_files  $media_file  =404;

        # A válaszfejlécek (nosniff, inline, CORP, Cache-Control a tényleges állapotból, Vary, CORS) az njs-ben:
        # add_header-rel a 416 minden fejlécet kétszer kapna (a fejlécszűrők a 416-ra újra lefutnak), lásd media.js.
        js_header_filter  media.headers;
    }

    # Érvénytelen token: IP-nként ~10 r/s (a túllépés 429).
    # A `return` a rewrite-fázisban, a limit_req előtt futna, ezért a 403 az njs content-handleréből jön.
    location @denied {
        add_header  X-Content-Type-Options  nosniff   always;
        add_header  Cache-Control           no-store  always;
        limit_req   zone=media_denied  burst=20  nodelay;
        js_content  media.denied;
    }

    location @notfound {
        add_header    X-Content-Type-Options  nosniff   always;
        add_header    Cache-Control           no-store  always;
        types         { }
        default_type  text/plain;
        return        404  "not found\n";
    }

    # Ismételt hibás ES256-aláírás ugyanarról az IP-ről (a kapu hibaszámlálója, FAILS_LIMIT / FAILS_WINDOW_MS a
    # media.js-ben; naplóban reason: blocked), a @denied mintájára.
    location @toomany {
        add_header    X-Content-Type-Options  nosniff   always;
        add_header    Cache-Control           no-store  always;
        types         { }
        default_type  text/plain;
        return        429  "too many requests\n";
    }

    location @gone {
        add_header    X-Content-Type-Options  nosniff   always;
        add_header    Cache-Control           no-store  always;
        types         { }
        default_type  text/plain;
        return        410  "expired\n";
    }
}
